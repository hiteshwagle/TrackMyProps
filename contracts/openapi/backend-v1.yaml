openapi: 3.1.0
info:
  title: TrackMyProps Backend API
  version: 1.5.0
  description: Operational, authenticated identity, owner property, and cash-flow endpoints.
x-api-major-version: v1
paths:
  /health:
    get:
      operationId: getBackendHealth
      summary: Check backend process health
      tags:
        - Operations
      responses:
        "200":
          description: The backend process is healthy.
          content:
            application/json:
              schema:
                $ref: ../json-schema/common/health-response.schema.json
              examples:
                healthy:
                  value:
                    service: backend
                    status: ok
                    version: 0.0.0
  /ready:
    get:
      operationId: getBackendReadiness
      summary: Check backend readiness
      tags:
        - Operations
      responses:
        "200":
          description: Supabase Auth is configured and reachable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/common/health-response.schema.json
              examples:
                ready:
                  value:
                    service: backend
                    status: ready
                    version: 0.0.0
        "503":
          description: Supabase Auth is not configured or reachable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Retrieve the authenticated user
      tags:
        - Identity
      security:
        - supabaseBearer: []
      responses:
        "200":
          description: The identity represented by the verified access token.
          content:
            application/json:
              schema:
                $ref: ../json-schema/identity/current-user.schema.json
              examples:
                owner:
                  value:
                    email: owner@example.com
                    id: e8cf2dbf-463e-485f-880d-cdb828749979
                    name: Owner Example
                    phone: null
        "401":
          description: The access token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Supabase Auth could not verify the access token.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/properties:
    get:
      operationId: listProperties
      summary: List one lifecycle group of the authenticated owner's properties
      tags:
        - Properties
      security:
        - supabaseBearer: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived]
            default: active
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Non-deleted properties in the requested lifecycle group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Property persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
    post:
      operationId: createProperty
      summary: Create a currently owned property
      tags:
        - Properties
      security:
        - supabaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyCreate"
      responses:
        "201":
          description: The property was created for the authenticated owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "422":
          description: Property values failed validation or database constraints.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Property persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/properties/{property_id}:
    get:
      operationId: getProperty
      summary: Retrieve one owner-visible property
      tags:
        - Properties
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: One non-deleted property visible to the authenticated owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property matched the identifier.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Property persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
    put:
      operationId: updateProperty
      summary: Replace the editable details of an owner property
      tags:
        - Properties
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyCreate"
      responses:
        "200":
          description: The property details were updated without changing lifecycle status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property matched the identifier.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "422":
          description: Property values failed validation or database constraints.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Property persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/properties/{property_id}/status:
    patch:
      operationId: updatePropertyStatus
      summary: Archive or restore an owner property
      tags:
        - Properties
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyStatusUpdate"
      responses:
        "200":
          description: The property was moved to the requested lifecycle list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property matched the identifier.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "422":
          description: The lifecycle transition was rejected.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Property persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/properties/{property_id}/income:
    get:
      operationId: listPropertyIncome
      summary: List income items for an owner property
      tags:
        - Cash flow
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Owner-visible income definitions for the property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashFlowItemList"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Cash-flow persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
    post:
      operationId: createPropertyIncome
      summary: Add an income item to an owner property
      tags:
        - Cash flow
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashFlowItemCreate"
      responses:
        "201":
          description: The income item was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashFlowItem"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property matched the identifier.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "422":
          description: Income values failed validation or database constraints.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Cash-flow persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/income/{item_id}:
    delete:
      operationId: deletePropertyIncome
      summary: Remove an income item from an owner property
      tags:
        - Cash flow
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: The income item was removed.
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property or income item matched the identifiers.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Cash-flow persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/properties/{property_id}/expenses:
    get:
      operationId: listPropertyExpenses
      summary: List expense items for an owner property
      tags:
        - Cash flow
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Owner-visible expense definitions for the property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashFlowItemList"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Cash-flow persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
    post:
      operationId: createPropertyExpense
      summary: Add an expense item to an owner property
      tags:
        - Cash flow
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CashFlowItemCreate"
      responses:
        "201":
          description: The expense item was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashFlowItem"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property matched the identifier.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "422":
          description: Expense values failed validation or database constraints.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Cash-flow persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/expenses/{item_id}:
    delete:
      operationId: deletePropertyExpense
      summary: Remove an expense item from an owner property
      tags:
        - Cash flow
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: The expense item was removed.
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property or expense item matched the identifiers.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Cash-flow persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/properties/{property_id}/cash-flow-summary:
    get:
      operationId: getPropertyCashFlowSummary
      summary: Retrieve annualised income and expense totals for one owner property
      tags:
        - Cash flow
      security:
        - supabaseBearer: []
      parameters:
        - $ref: "#/components/parameters/PropertyId"
        - name: year
          in: query
          description: Calendar year; defaults to the backend's current year.
          schema:
            type: integer
            minimum: 2000
            maximum: 9999
      responses:
        "200":
          description: Annualised recurring definitions plus one-offs in the selected year.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyCashFlowSummary"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "404":
          description: No owner-visible property matched the identifier.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Property or cash-flow persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
  /api/v1/portfolio/summary:
    get:
      operationId: getPortfolioSummary
      summary: Retrieve authoritative totals for active owner properties
      tags:
        - Portfolio
      security:
        - supabaseBearer: []
      responses:
        "200":
          description: Active-property totals with explicit missing-input counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
        "401":
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
        "503":
          description: Property persistence is unavailable.
          content:
            application/json:
              schema:
                $ref: ../json-schema/errors/error-response.schema.json
components:
  parameters:
    PropertyId:
      name: property_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    Money:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: AUD
    Rate:
      type: object
      additionalProperties: false
      required:
        - value
        - display_percent
      properties:
        value:
          type: string
          pattern: "^(0|0\\.[0-9]+|1(?:\\.0+)?)$"
        display_percent:
          type: string
          pattern: "^(0|[1-9][0-9]?|100)(\\.[0-9]+)?$"
    PortfolioMoney:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: AUD
    PositiveMoney:
      type: object
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: "^(?=.*[1-9])[0-9]+(?:\\.[0-9]{1,2})?$"
        currency:
          type: string
          const: AUD
    CashFlowItemCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - amount
        - frequency
        - start_date
        - end_date
        - occurrence_date
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        frequency:
          type: string
          enum: [weekly, fortnightly, monthly, quarterly, annually, one_off]
        start_date:
          type:
            - string
            - "null"
          format: date
        end_date:
          type:
            - string
            - "null"
          format: date
        occurrence_date:
          type:
            - string
            - "null"
          format: date
    CashFlowItem:
      allOf:
        - $ref: "#/components/schemas/CashFlowItemCreate"
        - type: object
          required:
            - item_id
            - property_id
            - item_type
            - created_at
            - updated_at
          properties:
            item_id:
              type: string
              format: uuid
            property_id:
              type: string
              format: uuid
            item_type:
              type: string
              enum: [income, expense]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    CashFlowItemList:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CashFlowItem"
        pagination:
          $ref: ../json-schema/common/pagination.schema.json
    PropertyCashFlowSummary:
      type: object
      additionalProperties: false
      required:
        - calculation_version
        - property_id
        - period
        - period_year
        - total_income
        - total_expenses
        - income_item_count
        - expense_item_count
      properties:
        calculation_version:
          type: string
          const: property-cash-flow-summary:1.0.0
        property_id:
          type: string
          format: uuid
        period:
          type: string
          const: annual
        period_year:
          type: integer
          minimum: 2000
          maximum: 9999
        total_income:
          $ref: "#/components/schemas/PortfolioMoney"
        total_expenses:
          $ref: "#/components/schemas/PortfolioMoney"
        income_item_count:
          type: integer
          minimum: 0
        expense_item_count:
          type: integer
          minimum: 0
    PropertyCreate:
      type: object
      additionalProperties: false
      required:
        - address_id
        - display_name
        - address_line_1
        - suburb
        - state
        - postcode
        - country
        - property_type
        - bedrooms
        - bathrooms
        - car_spaces
        - land_area_sqm
        - building_area_sqm
        - purchase_date
        - purchase_price
      properties:
        address_id:
          description: Canonical provider address identifier, or null for a manually entered address.
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 100
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        address_line_1:
          type: string
          minLength: 1
          maxLength: 200
        address_line_2:
          type:
            - string
            - "null"
          maxLength: 200
        suburb:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 50
        postcode:
          type: string
          pattern: "^[0-9]{4}$"
        country:
          type: string
          const: Australia
        property_type:
          type: string
          enum:
            [house, apartment_unit, townhouse, villa, land, commercial, other]
        bedrooms:
          type: string
          pattern: "^[0-9]+(?:\\.[05])?$"
        bathrooms:
          type: string
          pattern: "^[0-9]+(?:\\.[05])?$"
        car_spaces:
          type: integer
          minimum: 0
        land_area_sqm:
          type: string
          pattern: "^(?:0\\.[0-9]*[1-9][0-9]*|[1-9][0-9]*(?:\\.[0-9]+)?)$"
        building_area_sqm:
          type: string
          pattern: "^(?:0\\.[0-9]*[1-9][0-9]*|[1-9][0-9]*(?:\\.[0-9]+)?)$"
        purchase_date:
          type: string
          format: date
        purchase_price:
          $ref: "#/components/schemas/Money"
        current_value:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        current_value_as_of:
          type:
            - string
            - "null"
          format: date
        has_loan:
          type:
            - boolean
            - "null"
        original_loan_amount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        remaining_loan_balance:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        loan_balance_as_of:
          type:
            - string
            - "null"
          format: date
        annual_interest_rate:
          oneOf:
            - $ref: "#/components/schemas/Rate"
            - type: "null"
        repayment_amount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        repayment_frequency:
          type:
            - string
            - "null"
          enum: [weekly, fortnightly, monthly, quarterly, annually, null]
        next_repayment_date:
          type:
            - string
            - "null"
          format: date
        notes:
          type:
            - string
            - "null"
          maxLength: 2000
    Property:
      allOf:
        - $ref: "#/components/schemas/PropertyCreate"
        - type: object
          required:
            - property_id
            - owner_user_id
            - status
            - created_at
            - updated_at
          properties:
            property_id:
              type: string
              format: uuid
            owner_user_id:
              type: string
              format: uuid
            status:
              type: string
              enum: [active, sold, archived]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    PropertyList:
      type: object
      additionalProperties: false
      required:
        - items
        - pagination
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        pagination:
          $ref: ../json-schema/common/pagination.schema.json
    PropertyStatusUpdate:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, archived]
    PortfolioSummary:
      type: object
      additionalProperties: false
      required:
        - calculation_version
        - property_count
        - total_asset_value
        - asset_value_missing_count
        - total_remaining_loan
        - loan_balance_missing_count
        - total_equity
        - equity_missing_count
      properties:
        calculation_version:
          type: string
          const: portfolio-summary:1.0.0
        property_count:
          type: integer
          minimum: 0
        total_asset_value:
          oneOf:
            - $ref: "#/components/schemas/PortfolioMoney"
            - type: "null"
        asset_value_missing_count:
          type: integer
          minimum: 0
        total_remaining_loan:
          oneOf:
            - $ref: "#/components/schemas/PortfolioMoney"
            - type: "null"
        loan_balance_missing_count:
          type: integer
