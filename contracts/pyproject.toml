[project]
name = "trackmyprops-contracts"
version = "1.0.0"
description = "Validation tooling for TrackMyProps shared contracts"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.26,<5",
    "mypy>=1.20,<2",
    "openapi-spec-validator>=0.9,<1",
    "pytest>=9.1,<10",
    "pyyaml>=6.0,<7",
    "ruff>=0.16,<1",
    "types-jsonschema>=4.26,<5",
    "types-pyyaml>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
