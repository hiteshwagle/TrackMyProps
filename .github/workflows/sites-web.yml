name: Sites web application
on:
  push:
    paths:
      [
        'app/**',
        'lib/**',
        'db/**',
        'drizzle/**',
        'tests/**',
        'package.json',
        'pnpm-lock.yaml',
        'vite.config.ts',
        'tsconfig.json',
        '.openai/**',
        '.github/workflows/sites-web.yml',
      ]
  pull_request:
    paths:
      [
        'app/**',
        'lib/**',
        'db/**',
        'drizzle/**',
        'tests/**',
        'package.json',
        'pnpm-lock.yaml',
        'vite.config.ts',
        'tsconfig.json',
        '.openai/**',
        '.github/workflows/sites-web.yml',
      ]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
